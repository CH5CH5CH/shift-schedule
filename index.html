<!doctype html>
<html lang="ko" data-theme="p2d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
<script>
  // 저장된 테마를 그리기 전에 적용 (깜빡임 방지)
  try { var s = JSON.parse(localStorage.getItem('shift-schedule')); if (s && s.theme) document.documentElement.dataset.theme = s.theme.c + s.theme.d; } catch (e) {}
</script>
</head>
<body>
<div class="app" id="app" data-tab="today">
  <div class="bgfx"></div>
  <div class="sky"><div class="mline"></div></div>
  <div class="stars">
    <i class="star" style="left:12%;top:8%;animation-delay:0s"></i><i class="star" style="left:30%;top:4%;animation-delay:1.2s"></i>
    <i class="star" style="left:58%;top:10%;animation-delay:.6s"></i><i class="star" style="left:78%;top:5%;animation-delay:2s"></i>
    <i class="star" style="left:88%;top:16%;animation-delay:1.5s"></i><i class="star" style="left:20%;top:18%;animation-delay:2.4s"></i>
    <i class="star" style="left:66%;top:20%;animation-delay:.3s"></i><i class="star" style="left:45%;top:7%;animation-delay:1.8s"></i>
  </div>
  <div class="views">
    <section class="view" data-v="today"><div class="restfx" id="restfx"></div><div class="dtrack" id="dtrack"><div class="screen dpage" id="today" data-i="0"></div></div><div class="dnav"><div class="mdots" id="ddots"></div></div></section>
    <section class="view" data-v="roster"><div class="screen" id="roster"></div></section>
    <section class="view" data-v="tasks"><div class="screen" id="tasks"></div></section>
  </div>
  <div class="sheet glass" id="sheet" role="dialog" aria-modal="false"></div>
  <nav class="tabbar glass">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9.5" cy="10" r="1.3" fill="currentColor"/><circle cx="14" cy="14.5" r="1.8" fill="currentColor"/></svg><span>오늘</span></button>
    <button data-tab="roster"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>근무표</span></button>
    <button data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="5" cy="7" r="1.3" fill="currentColor"/><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="5" cy="17" r="1.3" fill="currentColor"/></svg><span>할 일</span></button>
  </nav>
</div>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
